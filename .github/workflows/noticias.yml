name: Publicar painel e notícias

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"     # a cada 30 minutos (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:            # botão "Run workflow" para rodar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Coletar notícias
        continue-on-error: true
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: python3 coletar_noticias.py

      - name: Montar o site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '*.py' ./ _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
